
# ---------------------------------------------------------------------#
# Wazuh Indexer Default Roles
# ---------------------------------------------------------------------#
#
# Two predefined personas, one self-contained role each:
#   dashboard_server - internal service account used by the Wazuh Dashboard
#   wazuh_manager    - service account for the Wazuh manager (data ingest + content read)
#
# Each one is mapped 1:1 to its user in roles_mapping.wazuh.yml. No
# administrative persona ships any more: administration goes through the
# built-in "admin" superuser (all_access), and anything in between is a role
# you define and map yourself. The permission names such a role grants are
# defined in action_groups.wazuh.yml, which is why that file lists far more
# than the roles here use.

# ---------------------------------------------------------------------#
# dashboard_server: internal service account used by the Wazuh Dashboard
# to read notification configs and query Wazuh indices on behalf of
# dashboard users.
# ---------------------------------------------------------------------#
dashboard_server:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster:admin/opensearch/notifications/configs/get'
  index_permissions:
    - index_patterns:
        - 'wazuh-*'
      allowed_actions:
        - 'read'
        - 'indices:admin/mappings/get'
  tenant_permissions: []
  static: false

# ---------------------------------------------------------------------#
# wazuh-manager: service account. Reads CTI consumer state, active
# responses and threat intelligence content; ingests events, metrics
# and states; manages state documents (index + delete).
# ---------------------------------------------------------------------#
wazuh_manager:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster_composite_ops'
    - 'indices:data/read/scroll/clear'
    - 'cluster_monitor'
  index_permissions:
    - index_patterns:
        - '.wazuh-settings'
      allowed_actions:
        - 'read'
    - index_patterns:
        - '.wazuh-cti-consumers'
        - 'wazuh-active-responses*'
        - 'wazuh-threatintel-*'
        - 'wazuh-findings-v5-*'
      allowed_actions:
        - 'read'
    - index_patterns:
        - 'wazuh-events-v5-*'
        - 'wazuh-events-raw-v5*'
        - 'wazuh-metrics-*'
      allowed_actions:
        - 'read'
        - 'index'
    - index_patterns:
        - 'wazuh-states-*'
      allowed_actions:
        - 'read'
        - 'index'
        - 'delete'
    - index_patterns:
        - 'wazuh-agent-*'
      allowed_actions:
        - 'read'
        - 'index'
        - 'delete'
    - index_patterns:
        - '.wazuh-threatintel-vulnerabilities*'
        - 'wazuh-threatintel-*'
      allowed_actions:
        - 'manage_point_in_time'
  tenant_permissions: []
  static: false

# ---------------------------------------------------------------------#
# wazuh-ai-assistant: grants every authenticated user access to their own
# AI assistant conversations, and only to those. Reads are restricted with
# Document Level Security parameter substitution: ${user.name} is replaced
# with the name of the authenticated user, so only the documents whose
# 'user' field matches it are visible.
#
# Writes are not granted at index level. They go through the setup plugin's
# /_plugins/_setup/ai_assistant/sessions API, which sets 'user' from the
# authenticated principal; the cluster permission below is what allows a
# user to call it. Document Level Security applies to reads only, so this
# is what keeps a session bound to its owner on the write path.
# ---------------------------------------------------------------------#
wazuh_ai_assistant:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'plugin:wazuh/ai_assistant/session/write'
  index_permissions:
    - index_patterns:
        - 'wazuh-ai-assistant-sessions*'
        - '.ds-wazuh-ai-assistant-sessions-*'
      dls: '{"term": {"user": "${user.name}"}}'
      fls: []
      masked_fields: []
      allowed_actions:
        - 'read'
  tenant_permissions: []
  static: false
