    concurrency:
      group: ${{ needs.engine-x64.result == 'failure' && format('indexer-build-{0}-{1}-rpm-x64', github.run_id, github.run_attempt) || format('indexer-reaper-{0}-{1}-build-rpm-x64', github.run_id, github.run_attempt) }}
