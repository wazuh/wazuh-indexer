        run: |
          echo "builds of arm64: ${{ join(needs.*.result, ', ') }}"

  # Keeps the "name" output of the workflow: the first package name set, in a fixed order.
  package-name:
    needs: [assemble-tar-x64, assemble-tar-arm64, assemble-deb-x64, assemble-deb-arm64, assemble-rpm-x64, assemble-rpm-arm64]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - name: Pick the package name
        id: name
        env:
          NAME_TAR_X64: ${{ needs.assemble-tar-x64.outputs.name }}
          NAME_TAR_ARM64: ${{ needs.assemble-tar-arm64.outputs.name }}
          NAME_DEB_X64: ${{ needs.assemble-deb-x64.outputs.name }}
          NAME_DEB_ARM64: ${{ needs.assemble-deb-arm64.outputs.name }}
          NAME_RPM_X64: ${{ needs.assemble-rpm-x64.outputs.name }}
          NAME_RPM_ARM64: ${{ needs.assemble-rpm-arm64.outputs.name }}
        run: |
          for name in "$NAME_TAR_X64" "$NAME_TAR_ARM64" "$NAME_DEB_X64" "$NAME_DEB_ARM64" "$NAME_RPM_X64" "$NAME_RPM_ARM64"; do
            if [ -n "$name" ]; then
              echo "name=$name" >> "$GITHUB_OUTPUT"
              break
            fi
          done
