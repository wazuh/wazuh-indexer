
# ---------------------------------------------------------------------#
# Wazuh Indexer Default Roles Mappings
# ---------------------------------------------------------------------#
#
# One composite role per user.

dashboard_server:
  reserved: true
  hidden: false
  users:
    - "kibanaserver"

wazuh_admin:
  reserved: true
  hidden: false
  users:
    - "wazuh-admin"
  backend_roles:
    - "admin"

wazuh_demo:
  reserved: true
  hidden: false
  users:
    - "wazuh-demo"

wazuh_readonly:
  reserved: true
  hidden: false
  users:
    - "wazuh-readonly"

wazuh_manager:
  reserved: true
  hidden: false
  users:
    - "wazuh-manager"

# Mapped to every authenticated user: the DLS query in the role scopes each
# user down to their own AI assistant conversations.
wazuh_ai_assistant:
  reserved: true
  hidden: false
  users:
    - "*"
