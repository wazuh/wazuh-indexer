
# ---------------------------------------------------------------------#
# Wazuh Indexer Default Roles
# ---------------------------------------------------------------------#
#
# Three predefined personas, one self-contained role each:
#   dashboard_server - internal service account used by the Wazuh Dashboard
#   wazuh_readonly   - read-only access
#   wazuh_manager    - service account for the Wazuh manager (data ingest + content read)
#
# Each one is mapped 1:1 to its user in roles_mapping.wazuh.yml. No
# administrative persona ships any more: administration goes through the
# built-in "admin" superuser (all_access), and anything in between is a role
# you define and map yourself. The permission names such a role grants are
# defined in action_groups.wazuh.yml, which is why that file lists far more
# than the roles here use.

# ---------------------------------------------------------------------#
# dashboard_server: internal service account used by the Wazuh Dashboard
# to read notification configs and query Wazuh indices on behalf of
# dashboard users.
# ---------------------------------------------------------------------#
dashboard_server:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster:admin/opensearch/notifications/configs/get'
  index_permissions:
    - index_patterns:
        - 'wazuh-*'
      allowed_actions:
        - 'read'
        - 'indices:admin/mappings/get'
  tenant_permissions: []
  static: false

# ---------------------------------------------------------------------#
# wazuh-readonly: read-only user.
# ---------------------------------------------------------------------#
wazuh_readonly:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster_composite_ops_ro'
    - 'indices:data/read/scroll/clear'
    - 'cluster_monitor'
    # AI assistant settings (setup plugin)
    - 'plugin:wazuh/ai_assistant/settings/read'
    - 'plugin:content_manager/subscription/get'
    - 'plugin:content_manager/logtest'
    - 'plugin:content_manager/logtest/*'
    - 'plugin:content_manager/promote/get'
    - 'plugin:content_manager/version/check'
    - 'cluster:admin/wazuh/securityanalytics/rules/evaluate'
    # Security Analytics (OpenSearch plugin, read)
    - 'cluster:admin/opensearch/securityanalytics/alerts/get'
    - 'cluster:admin/opensearch/securityanalytics/correlationAlerts/get'
    - 'cluster:admin/opensearch/securityanalytics/correlations/findings'
    - 'cluster:admin/opensearch/securityanalytics/correlations/list'
    - 'cluster:admin/opensearch/securityanalytics/correlation/rule/search'
    - 'cluster:admin/opensearch/securityanalytics/detector/get'
    - 'cluster:admin/opensearch/securityanalytics/detector/search'
    - 'cluster:admin/opensearch/securityanalytics/findings/get'
    - 'cluster:admin/opensearch/securityanalytics/logtype/search'
    - 'cluster:admin/opensearch/securityanalytics/mapping/get'
    - 'cluster:admin/opensearch/securityanalytics/mapping/view/get'
    - 'cluster:admin/opensearch/securityanalytics/rule/get'
    - 'cluster:admin/opensearch/securityanalytics/rule/search'
    - 'cluster:admin/opensearch/securityanalytics/rules/categories'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/alerts/get'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/iocs/findings/get'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/iocs/list'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/monitors/search'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/sources/get'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/sources/search'
    # Alerting (read + acknowledge alerts)
    - 'cluster:admin/opendistro/alerting/alerts/get'
    - 'cluster:admin/opendistro/alerting/destination/get'
    - 'cluster:admin/opendistro/alerting/monitor/get'
    - 'cluster:admin/opendistro/alerting/monitor/search'
    - 'cluster:admin/opensearch/alerting/comments/search'
    - 'cluster:admin/opensearch/alerting/findings/get'
    - 'cluster:admin/opensearch/alerting/remote/indexes/get'
    - 'cluster:admin/opensearch/alerting/v2/alerts/get'
    - 'cluster:admin/opensearch/alerting/v2/monitor/get'
    - 'cluster:admin/opensearch/alerting/v2/monitor/search'
    - 'cluster:admin/opensearch/alerting/workflow/get'
    - 'cluster:admin/opensearch/alerting/workflow_alerts/get'
    # Anomaly detection (read)
    - 'cluster:admin/opendistro/ad/detector/info'
    - 'cluster:admin/opendistro/ad/detector/search'
    - 'cluster:admin/opendistro/ad/detector/suggest'
    - 'cluster:admin/opendistro/ad/detector/validate'
    - 'cluster:admin/opendistro/ad/detectors/get'
    - 'cluster:admin/opendistro/ad/result/search'
    - 'cluster:admin/opendistro/ad/result/topAnomalies'
    - 'cluster:admin/opendistro/ad/tasks/search'
    # Notifications (read)
    - 'cluster:admin/opensearch/notifications/channels/get'
    - 'cluster:admin/opensearch/notifications/features'
    # Reporting (read + download)
    - 'cluster:admin/opendistro/reports/definition/get'
    - 'cluster:admin/opendistro/reports/definition/list'
    - 'cluster:admin/opendistro/reports/instance/get'
    - 'cluster:admin/opendistro/reports/instance/list'
    - 'cluster:admin/opendistro/reports/menu/download'
    # Index management (read): ISM explain/get, rollup/transform get/search
    - 'cluster:admin/opendistro/ism/managedindex/explain'
    - 'cluster:admin/opendistro/ism/policy/get'
    - 'cluster:admin/opendistro/ism/policy/search'
    - 'cluster:admin/opendistro/rollup/get'
    - 'cluster:admin/opendistro/rollup/search'
    - 'cluster:admin/opendistro/transform/get'
    - 'cluster:admin/opendistro/transform/search'
  index_permissions:
    - index_patterns:
        - '*'
        - '.kibana*'
      allowed_actions:
        - 'get'
        - 'read'
        - 'indices:admin/aliases/get'
        - 'indices:admin/mappings/get'
        - 'indices:monitor/*'
    - index_patterns:
        - '.wazuh-settings'
      allowed_actions:
        - 'read'
    - index_patterns:
        - '.wazuh-internal-state'
      allowed_actions:
        - 'read'
    # Content Manager promote preview issues an existence check per
    # threatintel resource index (indices:admin/exists); read is already
    # granted via the '*' pattern above.
    - index_patterns:
        - 'wazuh-threatintel-*'
      allowed_actions:
        - 'indices:admin/exists'
  tenant_permissions: []
  static: false

# ---------------------------------------------------------------------#
# wazuh-manager: service account. Reads CTI consumer state, active
# responses and threat intelligence content; ingests events, metrics
# and states; manages state documents (index + delete).
# ---------------------------------------------------------------------#
wazuh_manager:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster_composite_ops'
    - 'indices:data/read/scroll/clear'
    - 'cluster_monitor'
  index_permissions:
    - index_patterns:
        - '.wazuh-settings'
      allowed_actions:
        - 'read'
    - index_patterns:
        - '.wazuh-cti-consumers'
        - 'wazuh-active-responses*'
        - 'wazuh-threatintel-*'
        - 'wazuh-findings-v5-*'
      allowed_actions:
        - 'read'
    - index_patterns:
        - 'wazuh-events-v5-*'
        - 'wazuh-events-raw-v5*'
        - 'wazuh-metrics-*'
      allowed_actions:
        - 'read'
        - 'index'
    - index_patterns:
        - 'wazuh-states-*'
      allowed_actions:
        - 'read'
        - 'index'
        - 'delete'
    - index_patterns:
        - 'wazuh-agent-*'
      allowed_actions:
        - 'read'
        - 'index'
        - 'delete'
    - index_patterns:
        - '.wazuh-threatintel-vulnerabilities*'
        - 'wazuh-threatintel-*'
      allowed_actions:
        - 'manage_point_in_time'
  tenant_permissions: []
  static: false

# ---------------------------------------------------------------------#
# wazuh-ai-assistant: grants every authenticated user access to their own
# AI assistant conversations, and only to those. Reads are restricted with
# Document Level Security parameter substitution: ${user.name} is replaced
# with the name of the authenticated user, so only the documents whose
# 'user' field matches it are visible.
#
# Writes are not granted at index level. They go through the setup plugin's
# /_plugins/_setup/ai_assistant/sessions API, which sets 'user' from the
# authenticated principal; the cluster permission below is what allows a
# user to call it. Document Level Security applies to reads only, so this
# is what keeps a session bound to its owner on the write path.
# ---------------------------------------------------------------------#
wazuh_ai_assistant:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'plugin:wazuh/ai_assistant/session/write'
  index_permissions:
    - index_patterns:
        - 'wazuh-ai-assistant-sessions*'
        - '.ds-wazuh-ai-assistant-sessions-*'
      dls: '{"term": {"user": "${user.name}"}}'
      fls: []
      masked_fields: []
      allowed_actions:
        - 'read'
  tenant_permissions: []
  static: false
