
# ---------------------------------------------------------------------#
# Wazuh Indexer Default Roles
# ---------------------------------------------------------------------#
#
# Four predefined personas, one self-contained role each:
#   wazuh_admin    - full Wazuh access (no super-admin / security config)
#   wazuh_demo     - default user: visualize data + manage threatintel content
#   wazuh_readonly - read-only access
#   wazuh_server   - service account for the Wazuh server (data ingest + content read)
#
# Each role is mapped 1:1 to its user in roles_mapping.wazuh.yml.

# ---------------------------------------------------------------------#
# Internal user of the Wazuh Dashboard.
# ---------------------------------------------------------------------#
dashboard_server:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster:admin/opensearch/notifications/configs/get'
  index_permissions:
    - index_patterns:
        - 'wazuh-*'
      allowed_actions:
        - 'read'
  tenant_permissions: []
  static: false

# ---------------------------------------------------------------------#
# wazuh-admin: full access to all Wazuh features, excluding super-admin
# features such as security configuration.
# ---------------------------------------------------------------------#
wazuh_admin:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster_composite_ops'
    - 'cluster_monitor'
    # Content Manager
    - 'plugin:content_manager/policy/put'
    - 'plugin:content_manager/create/*'
    - 'plugin:content_manager/update/*'
    - 'plugin:content_manager/delete/*'
    - 'plugin:content_manager/subscription/get'
    - 'plugin:content_manager/subscription/post'
    - 'plugin:content_manager/subscription/delete'
    - 'plugin:content_manager/logtest*'
    - 'plugin:content_manager/promote/*'
    - 'plugin:content_manager/space/delete'
    # Security Analytics
    - 'cluster:admin/wazuh/securityanalytics/rule/custom/*'
    - 'cluster:admin/wazuh/securityanalytics/logtype/*'
    - 'cluster:admin/wazuh/securityanalytics/rules/evaluate'
    - 'cluster:admin/wazuh/securityanalytics/space/delete'
    # Security Analytics (OpenSearch plugin, full)
    - 'cluster:admin/opensearch/securityanalytics/alerts/*'
    - 'cluster:admin/opensearch/securityanalytics/connections/*'
    - 'cluster:admin/opensearch/securityanalytics/correlationAlerts/*'
    - 'cluster:admin/opensearch/securityanalytics/correlations/*'
    - 'cluster:admin/opensearch/securityanalytics/detector/*'
    - 'cluster:admin/opensearch/securityanalytics/findings/*'
    - 'cluster:admin/opensearch/securityanalytics/logtype/*'
    - 'cluster:admin/opensearch/securityanalytics/mapping/*'
    - 'cluster:admin/opensearch/securityanalytics/rule/*'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/*'
    # Alerting (full)
    - 'cluster:admin/opendistro/alerting/*'
    - 'cluster:admin/opensearch/alerting/*'
    # Anomaly detection (detector ops)
    - 'cluster:admin/opendistro/ad/*'
    # Notifications (full)
    - 'cluster:admin/opensearch/notifications/*'
    # Reporting (full)
    - 'cluster:admin/opendistro/reports/*'
    # Index management (full): ISM, rollups, transforms
    - 'cluster:admin/opendistro/ism/*'
    - 'cluster:admin/opendistro/rollup/*'
    - 'cluster:admin/opendistro/transform/*'
    - 'cluster:admin/opensearch/controlcenter/lron/*'
  index_permissions:
    - index_patterns:
        - '*'
        - '.kibana*'
      allowed_actions:
        - 'get'
        - 'read'
        - 'indices:admin/aliases/get'
        - 'indices:admin/opensearch/ism/*'
        - 'indices:internal/plugins/replication/index/stop'
    - index_patterns:
        - '.wazuh-settings'
      allowed_actions:
        - 'read'
        - 'index'
    - index_patterns:
        - 'wazuh-events-v5*'
      allowed_actions:
        - 'index'
    - index_patterns:
        - '.wazuh-internal-state'
      allowed_actions:
        - 'read'
        - 'index'
        - 'delete'
    - index_patterns:
        - 'wazuh-threatintel-*'
        - '.opensearch-sap-*'
      allowed_actions:
        - 'index'
        - 'delete'
        - 'indices:admin/exists'
        - 'indices:admin/refresh'
  tenant_permissions: []
  static: true

# ---------------------------------------------------------------------#
# wazuh-demo: default user with regular access. Can visualize data and
# index/update/delete threatintel resources.
# ---------------------------------------------------------------------#
wazuh_demo:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster_composite_ops'
    - 'cluster_monitor'
    # Content Manager
    - 'plugin:content_manager/create/*'
    - 'plugin:content_manager/update/*'
    - 'plugin:content_manager/delete/*'
    - 'plugin:content_manager/subscription/get'
    - 'plugin:content_manager/logtest*'
    - 'plugin:content_manager/promote/*'
    - 'plugin:content_manager/space/delete'
    # Security Analytics
    - 'cluster:admin/wazuh/securityanalytics/rule/custom/*'
    - 'cluster:admin/wazuh/securityanalytics/logtype/*'
    - 'cluster:admin/wazuh/securityanalytics/rules/evaluate'
    - 'cluster:admin/wazuh/securityanalytics/space/delete'
    # Security Analytics (OpenSearch plugin, full)
    - 'cluster:admin/opensearch/securityanalytics/alerts/*'
    - 'cluster:admin/opensearch/securityanalytics/connections/*'
    - 'cluster:admin/opensearch/securityanalytics/correlationAlerts/*'
    - 'cluster:admin/opensearch/securityanalytics/correlations/*'
    - 'cluster:admin/opensearch/securityanalytics/detector/*'
    - 'cluster:admin/opensearch/securityanalytics/findings/*'
    - 'cluster:admin/opensearch/securityanalytics/logtype/*'
    - 'cluster:admin/opensearch/securityanalytics/mapping/*'
    - 'cluster:admin/opensearch/securityanalytics/rule/*'
    - 'cluster:admin/opensearch/securityanalytics/threatintel/*'
    # Alerting (read + acknowledge alerts)
    - 'cluster:admin/opendistro/alerting/alerts/get'
    - 'cluster:admin/opendistro/alerting/destination/get'
    - 'cluster:admin/opendistro/alerting/monitor/get'
    - 'cluster:admin/opendistro/alerting/monitor/search'
    - 'cluster:admin/opensearch/alerting/comments/search'
    - 'cluster:admin/opensearch/alerting/findings/get'
    - 'cluster:admin/opensearch/alerting/remote/indexes/get'
    - 'cluster:admin/opensearch/alerting/v2/alerts/get'
    - 'cluster:admin/opensearch/alerting/v2/monitor/get'
    - 'cluster:admin/opensearch/alerting/v2/monitor/search'
    - 'cluster:admin/opensearch/alerting/workflow/get'
    - 'cluster:admin/opensearch/alerting/workflow_alerts/get'
    # Anomaly detection (read)
    - 'cluster:admin/opendistro/ad/detector/info'
    - 'cluster:admin/opendistro/ad/detector/search'
    - 'cluster:admin/opendistro/ad/detector/suggest'
    - 'cluster:admin/opendistro/ad/detector/validate'
    - 'cluster:admin/opendistro/ad/detectors/get'
    - 'cluster:admin/opendistro/ad/result/search'
    - 'cluster:admin/opendistro/ad/result/topAnomalies'
    - 'cluster:admin/opendistro/ad/tasks/search'
    # Notifications (read)
    - 'cluster:admin/opensearch/notifications/channels/get'
    - 'cluster:admin/opensearch/notifications/configs/get'
    - 'cluster:admin/opensearch/notifications/features'
    # Reporting (read + download)
    - 'cluster:admin/opendistro/reports/definition/get'
    - 'cluster:admin/opendistro/reports/definition/list'
    - 'cluster:admin/opendistro/reports/instance/get'
    - 'cluster:admin/opendistro/reports/instance/list'
    - 'cluster:admin/opendistro/reports/menu/download'
    # Index management (read): ISM explain/get, rollup/transform get/search
    - 'cluster:admin/opendistro/ism/managedindex/explain'
    - 'cluster:admin/opendistro/ism/policy/get'
    - 'cluster:admin/opendistro/ism/policy/search'
    - 'cluster:admin/opendistro/rollup/get'
    - 'cluster:admin/opendistro/rollup/search'
    - 'cluster:admin/opendistro/transform/get'
    - 'cluster:admin/opendistro/transform/search'
  index_permissions:
    - index_patterns:
        - '*'
        - '.kibana*'
      allowed_actions:
        - 'get'
        - 'read'
        - 'indices:admin/aliases/get'
    - index_patterns:
        - '.wazuh-internal-state'
      allowed_actions:
        - 'read'
    - index_patterns:
        - 'wazuh-threatintel-*'
        - '.opensearch-sap-*'
      allowed_actions:
        - 'index'
        - 'delete'
        - 'indices:admin/exists'
        - 'indices:admin/refresh'
  tenant_permissions: []
  static: true

