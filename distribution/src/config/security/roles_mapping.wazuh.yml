
# ---------------------------------------------------------------------#
# Wazuh Indexer Default Roles Mappings
# ---------------------------------------------------------------------#
#
# One composite role per user.

dashboard_server:
  reserved: true
  hidden: false
  users:
    - "kibanaserver"

wazuh_admin:
  reserved: true
  hidden: false
  users:
    - "wazuh-admin"
  backend_roles:
    - "admin"

wazuh_demo:
  reserved: true
  hidden: false
  users:
    - "wazuh-demo"

wazuh_readonly:
  reserved: true
  hidden: false
  users:
    - "wazuh-readonly"

wazuh_manager:
  reserved: true
  hidden: false
  users:
    - "wazuh-manager"

# Mapped to every authenticated user: the role confines each user to their own
# AI assistant conversations, on both the read and the write path. See the
# comment above the role definition.
wazuh_ai_assistant:
  reserved: true
  hidden: false
  users:
    - "*"
