run-name: Build ${{ inputs.distribution }} Wazuh Indexer on ${{ inputs.architecture }} | ${{ inputs.id }}
name: (4.x) Build packages

# This workflow runs when any of the following occur:
# - Run manually
# - Invoked from another workflow
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision"
        type: string
        default: "0"
      upload:
        description: "Upload ?"
        type: boolean
        default: false
      is_stage:
        description: "Is stage ?"
        type: boolean
        default: false
      distribution:
        description: '[ "tar", "rpm", "deb" ]'
        type: string
        default: '[ "rpm", "deb" ]'
      architecture:
        description: '[ "x64", "arm64" ]'
        type: string
        default: '[ "x64", "arm64" ]'
      checksum:
        description: "Checksum ?"
        type: boolean
        default: false
      id:
        description: "ID used to identify the workflow uniquely."
        type: string
        required: false
  workflow_call:
    inputs:
      revision:
        description: "Revision"
        type: string
        default: "0"
      upload:
        description: "Upload ?"
        type: boolean
        default: false
      is_stage:
        description: "Is stage ?"
        type: boolean
        default: false
      distribution:
        description: '[ "tar", "rpm", "deb" ]'
        type: string
        default: '[ "rpm", "deb" ]'
      architecture:
        description: '[ "x64", "arm64" ]'
        type: string
        default: '[ "x64", "arm64" ]'
      checksum:
        description: "Checksum ?"
        type: boolean
        default: false
      id:
        type: string
        required: false
    secrets:
      AWS_INDEXER_ACTIONS_ROLE:
        required: true
        description: "AWS IAM OIDC role for S3 and infrastructure access"
      CI_AWS_REGION:
        required: true
        description: "AWS region for the internal S3 bucket and final package upload"
      CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY:
        required: true
        description: "AWS user access key for the final package upload"
      CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY:
        required: true
        description: "AWS user secret key for the final package upload"

permissions:
  id-token: write
  contents: read
# ==========================
# Bibliography
# ==========================
#
# * Reusable workflows: limitations
#   | https://docs.github.com/en/actions/using-workflows/reusing-workflows#limitations
# * Using matrix in reusable workflows:
#   | https://docs.github.com/en/actions/using-workflows/reusing-workflows#using-a-matrix-strategy-with-a-reusable-workflow
# * Reading input from the called workflow
#   | https://docs.github.com/en/enterprise-cloud@latest/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_callinputs
# * Ternary operator
#   | https://docs.github.com/en/actions/learn-github-actions/expressions#example

jobs:
  setup:
    name: Set up variables
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      previous_version: ${{ steps.product_versions.outputs.previous_version }}
      current_version: ${{ steps.product_versions.outputs.current_version }}
      arm64_update_tests: ${{ steps.product_versions.outputs.arm64_update_tests }}
    steps:
      - id: matrix
        run: |
          matrix=$(jq -cn \
              --argjson distribution '${{ inputs.distribution }}' \
              --argjson architecture '${{ inputs.architecture }}' \
              '{distribution: $distribution, architecture: $architecture}'
          )
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
      - id: product_versions
        name: Get current version and latest Wazuh release from GitHub
        env:
          # Authenticated requests avoid the per-IP rate limit shared by the CodeBuild runners.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(bash packaging_scripts/product_version.sh)"

          # -f makes HTTP errors (e.g. rate limiting) fail the step instead of feeding an error object to jq.
          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/wazuh/wazuh/releases?per_page=100")
          RELEASES=$(jq -r '.[].tag_name' <<< "$RESPONSE" | sed 's/^v//' | grep -E '^4\.[0-9]+\.[0-9]+$' || true)

          # Highest stable release strictly lower than the current version, compared as versions.
          PREVIOUS=$(printf '%s\n' "${RELEASES}" "${CURRENT}" | sort -Vu | grep -x -B1 -F "${CURRENT}" | grep -vx -F "${CURRENT}" || true)

          echo "Current version: $CURRENT"
          echo "Latest release detected: $PREVIOUS"
          if [[ -z "$PREVIOUS" ]]; then
            echo "::error::Could not detect a Wazuh release older than ${CURRENT}. The package update tests need it."
            exit 1
          fi

          # The arm64 update tests only run when the previous version is 4.12.0 or later.
          if [[ "$(printf '%s\n' 4.12.0 "$PREVIOUS" | sort -V | head -n1)" == "4.12.0" ]]; then
            ARM64_UPDATE_TESTS=true
          else
            ARM64_UPDATE_TESTS=false
          fi

          echo "previous_version=$PREVIOUS" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          echo "arm64_update_tests=$ARM64_UPDATE_TESTS" >> $GITHUB_OUTPUT

  build:
    needs: [setup]
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-${{ matrix.architecture == 'arm64' && 'arm' || 'amd' }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Provision
        run: |
          sudo bash packaging_scripts/provision.sh

      - name: Provision (rpm)
        if: ${{ matrix.distribution == 'rpm' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cpio rpm python3-pip openssh-client

      - name: Provision (maven)
        run: |
          command -v mvn >/dev/null || (sudo apt-get update -y && sudo apt-get install -y maven)

      - name: Run `baptizer.sh` (min)
        run: |
          name=$(bash packaging_scripts/baptizer.sh -m \
            -a ${{ matrix.architecture }} \
            -d ${{ matrix.distribution }} \
            -r ${{ inputs.revision }} \
            ${{ inputs.is_stage && '-x' || '' }} \
          )
          echo "name=$name" >> $GITHUB_OUTPUT
        id: min_package

      - name: Run `baptizer.sh`
        run: |
          name=$(bash packaging_scripts/baptizer.sh \
            -a ${{ matrix.architecture }} \
            -d ${{ matrix.distribution }} \
            -r ${{ inputs.revision }} \
            ${{ inputs.is_stage && '-x' || '' }} \
          )
          echo "name=$name" >> $GITHUB_OUTPUT
        id: package

      - name: Run `build.sh`
        run: |
          id -u builder &>/dev/null || useradd -m builder
          cp -a "$HOME/.m2" /home/builder/.m2 2>/dev/null || true
          cp -a "$GRADLE_USER_HOME" /home/builder/.gradle 2>/dev/null || true
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder
          runuser -u builder -- env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "GRADLE_USER_HOME=/home/builder/.gradle" \
          bash packaging_scripts/build.sh \
            -a ${{ matrix.architecture }} \
            -d ${{ matrix.distribution }} \
            -n ${{ steps.min_package.outputs.name }}
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run `assemble.sh`
        run: |
          bash packaging_scripts/assemble.sh \
            -a ${{ matrix.architecture }} \
            -d ${{ matrix.distribution }} \
            -r ${{ inputs.revision }}

      - name: Provision (allocator)
        if: ${{ matrix.distribution == 'deb' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip openssh-client

      - name: Clone Wazuh Automation repository and install dependencies
        if: ${{ matrix.distribution == 'rpm' || matrix.distribution == 'deb' }}
        env:
          username: "wazuh-devel-xdrsiem-indexer"
        run: |
          git clone https://${{ env.username }}:${{ secrets.INDEXER_BOT_TOKEN }}@github.com/wazuh/wazuh-automation.git -b $(bash packaging_scripts/product_version.sh)
          cd wazuh-automation
          python3 -m pip install -r deployability/deps/requirements.txt

      - name: Configure AWS credentials
        if: ${{ matrix.distribution == 'rpm' || matrix.distribution == 'deb' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.CI_AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_INDEXER_ACTIONS_ROLE }}
          role-session-name: "4_package_builder_indexer"

      # The package tests run on an Allocator machine: they need a real systemd to start the
      # wazuh-indexer service, which the CodeBuild runners don't provide.
      - name: Setup Allocator environment
        if: ${{ matrix.distribution == 'rpm' || matrix.distribution == 'deb' }}
        run: |
          bash packaging_scripts/allocator_setup_environment.sh ${{ matrix.distribution }} ${{ matrix.architecture }} ${{ github.run_id }}

          ansible_host=$(grep 'ansible_host:' /tmp/inventory.yaml | sed 's/.*: *//')
          ansible_port=$(grep 'ansible_port:' /tmp/inventory.yaml | sed 's/.*: *//')
          ansible_user=$(grep 'ansible_user:' /tmp/inventory.yaml | sed 's/.*: *//')
          ansible_ssh_private_key_file=$(grep 'ansible_ssh_private_key_file:' /tmp/inventory.yaml | sed 's/.*: *//')
          ssh_command="ssh -o StrictHostKeyChecking=no -i $ansible_ssh_private_key_file -p $ansible_port $ansible_user@$ansible_host"
          scp_command="scp -o StrictHostKeyChecking=no -i $ansible_ssh_private_key_file -P $ansible_port"

          # Package manager commands, run on the Allocator machine
          if [[ "${{ matrix.distribution }}" == "rpm" ]]; then
            pkg_install="sudo yum localinstall -y"
            pkg_remove="sudo yum remove -y wazuh-indexer"
            pkg_version="rpm -q --qf '%{VERSION}' wazuh-indexer"
          else
            pkg_install="sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y"
            pkg_remove="sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get remove --purge -y wazuh-indexer"
            pkg_version="dpkg-query -W -f='\${Version}' wazuh-indexer | cut -d- -f1"
          fi

          echo "ansible_host=$ansible_host" >> $GITHUB_OUTPUT
          echo "ansible_port=$ansible_port" >> $GITHUB_OUTPUT
          echo "ansible_user=$ansible_user" >> $GITHUB_OUTPUT
          echo "ansible_ssh_private_key_file=$ansible_ssh_private_key_file" >> $GITHUB_OUTPUT
          echo "ssh_command=$ssh_command" >> $GITHUB_OUTPUT
          echo "scp_command=$scp_command" >> $GITHUB_OUTPUT
          echo "pkg_install=$pkg_install" >> $GITHUB_OUTPUT
          echo "pkg_remove=$pkg_remove" >> $GITHUB_OUTPUT
          echo "pkg_version=$pkg_version" >> $GITHUB_OUTPUT
        id: allocator

      - name: Test package installation
        if: ${{ matrix.distribution == 'rpm' || matrix.distribution == 'deb' }}
        run: |
          # This step sends the package to the Allocator machine and installs it

          # echo "hello" is needed to create the SSH connection
          ${{ steps.allocator.outputs.ssh_command }} 'echo "hello"'
          # Wait for the first boot to finish, so it doesn't hold the package manager lock
          ${{ steps.allocator.outputs.ssh_command }} 'bash -se' << 'EOF'
          set -euo pipefail
          if command -v cloud-init >/dev/null; then sudo cloud-init status --wait >/dev/null || true; fi
          if command -v apt-get >/dev/null; then echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null; fi
          EOF
          ${{ steps.allocator.outputs.scp_command }} artifacts/dist/${{ steps.package.outputs.name }} ${{ steps.allocator.outputs.ansible_user }}@${{ steps.allocator.outputs.ansible_host }}:/home/${{ steps.allocator.outputs.ansible_user }}/
          ${{ steps.allocator.outputs.ssh_command }} 'bash -se' << 'EOF'
          set -euo pipefail
          ${{ steps.allocator.outputs.pkg_install }} "/home/${{ steps.allocator.outputs.ansible_user }}/${{ steps.package.outputs.name }}"
          test "$(${{ steps.allocator.outputs.pkg_version }})" = "${{ needs.setup.outputs.current_version }}"
          EOF

      - name: Test package uninstallation
        if: ${{ matrix.distribution == 'rpm' || matrix.distribution == 'deb' }}
        run: |
          # This step uninstalls the package from the Allocator machine

          ${{ steps.allocator.outputs.ssh_command }} '${{ steps.allocator.outputs.pkg_remove }}'

      - name: Test package update stopping the indexer
        if: ${{ (matrix.distribution == 'rpm' || matrix.distribution == 'deb') && (matrix.architecture == 'x64' || (needs.setup.outputs.arm64_update_tests == 'true' && matrix.architecture == 'arm64'))}}
        run: |
          # This step sends the package to the Allocator machine and the script to install a previous version
          # Then installs the previous version, stops the indexer and installs the new version

          ${{ steps.allocator.outputs.scp_command }} artifacts/dist/${{ steps.package.outputs.name }} ${{ steps.allocator.outputs.ansible_user }}@${{ steps.allocator.outputs.ansible_host }}:/home/${{ steps.allocator.outputs.ansible_user }}/
          ${{ steps.allocator.outputs.scp_command }} packaging_scripts/indexer_node_install.sh ${{ steps.allocator.outputs.ansible_user }}@${{ steps.allocator.outputs.ansible_host }}:/home/${{ steps.allocator.outputs.ansible_user }}/
          # Run remotely with `set -e` so a failed install of the previous version fails the step
          # instead of falling through to a fresh install of the new package.
          ${{ steps.allocator.outputs.ssh_command }} 'bash -se' << 'EOF'
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a bash /home/${{ steps.allocator.outputs.ansible_user }}/indexer_node_install.sh ${{ needs.setup.outputs.previous_version }}
          test "$(${{ steps.allocator.outputs.pkg_version }})" = "${{ needs.setup.outputs.previous_version }}"
          sudo systemctl stop wazuh-indexer
          ${{ steps.allocator.outputs.pkg_install }} "/home/${{ steps.allocator.outputs.ansible_user }}/${{ steps.package.outputs.name }}"
          test "$(${{ steps.allocator.outputs.pkg_version }})" = "${{ needs.setup.outputs.current_version }}"
          EOF

          # Check if the indexer is running
          indexer_running=$(${{ steps.allocator.outputs.ssh_command }} 'systemctl is-active --quiet wazuh-indexer && echo 1 || echo 0')
          if [[ "$indexer_running" == "1" ]]; then
            echo "The indexer is running after the update, but it should not be."
            exit 1
          else
            echo "The indexer is not running after the update, as expected."
          fi

      - name: Test package update without stopping the indexer
        if: ${{ (matrix.distribution == 'rpm' || matrix.distribution == 'deb') && (matrix.architecture == 'x64' || (needs.setup.outputs.arm64_update_tests == 'true' && matrix.architecture == 'arm64'))}}
        run: |
          # This step sends the package to the Allocator machine and the script to install a previous version
          # Then installs the previous version and installs the new version without stopping the indexer

          ${{ steps.allocator.outputs.ssh_command }} '${{ steps.allocator.outputs.pkg_remove }}'
          ${{ steps.allocator.outputs.scp_command }} artifacts/dist/${{ steps.package.outputs.name }} ${{ steps.allocator.outputs.ansible_user }}@${{ steps.allocator.outputs.ansible_host }}:/home/${{ steps.allocator.outputs.ansible_user }}/
          ${{ steps.allocator.outputs.scp_command }} packaging_scripts/indexer_node_install.sh ${{ steps.allocator.outputs.ansible_user }}@${{ steps.allocator.outputs.ansible_host }}:/home/${{ steps.allocator.outputs.ansible_user }}/
          # Run remotely with `set -e` so a failed install of the previous version fails the step
          # instead of falling through to a fresh install of the new package.
          ${{ steps.allocator.outputs.ssh_command }} 'bash -se' << 'EOF'
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a bash /home/${{ steps.allocator.outputs.ansible_user }}/indexer_node_install.sh ${{ needs.setup.outputs.previous_version }}
          test "$(${{ steps.allocator.outputs.pkg_version }})" = "${{ needs.setup.outputs.previous_version }}"
          systemctl is-active --quiet wazuh-indexer
          ${{ steps.allocator.outputs.pkg_install }} "/home/${{ steps.allocator.outputs.ansible_user }}/${{ steps.package.outputs.name }}"
          test "$(${{ steps.allocator.outputs.pkg_version }})" = "${{ needs.setup.outputs.current_version }}"
          EOF

          # Check if the indexer is running
          indexer_running=$(${{ steps.allocator.outputs.ssh_command }} 'systemctl is-active --quiet wazuh-indexer && echo 1 || echo 0')
          if [[ "$indexer_running" == "0" ]]; then
            echo "The indexer is not running after the update, but it should be."
            exit 1
          else
            echo "The indexer is running after the update, as expected."
          fi

      - name: Destroy Allocator Machine
        if: ${{ matrix.distribution == 'rpm' || matrix.distribution == 'deb' }}
        run: |
          cd wazuh-automation/deployability
          python3 modules/allocation/main.py --action delete --track-output "/tmp/track.yaml"

      - name: Set up AWS CLI for final package upload
        if: ${{ inputs.upload }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload package to S3
        if: ${{ inputs.upload }}
        run: |
          src="artifacts/dist/${{ steps.package.outputs.name }}"
          dest="s3://xdrsiem-packages-dev-internal/development/wazuh/4.x/main/packages/"
          aws s3 cp "$src" "$dest"
          s3uri="${dest}${{ steps.package.outputs.name }}"
          echo "::notice::S3 URI: ${s3uri}"

      - name: Upload checksum to S3
        if: ${{ inputs.upload && inputs.checksum }}
        run: |
          src="artifacts/dist/${{ steps.package.outputs.name }}.sha512"
          dest="s3://xdrsiem-packages-dev-internal/development/wazuh/4.x/main/packages/"
          aws s3 cp "$src" "$dest"
          s3uri="${dest}${{ steps.package.outputs.name }}.sha512"
          echo "::notice::S3 sha512 URI: ${s3uri}"

      - name: On failure delete Allocator Machine
        if: ${{ (matrix.distribution == 'rpm' || matrix.distribution == 'deb') && (failure() || cancelled()) }}
        run: |
          cd wazuh-automation/deployability
          python3 modules/allocation/main.py --action delete --track-output /tmp/track.yaml
