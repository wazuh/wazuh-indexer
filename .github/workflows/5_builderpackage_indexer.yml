run-name: Build ${{ inputs.distribution }} Wazuh Indexer on ${{ inputs.architecture }} | ${{ inputs.id }}
name: (5.x) Build packages

env:
  CI_ARTIFACTS_REPO: wazuh-indexer
  CI_ARTIFACTS_WORKFLOW: 5_builderpackage_indexer
  CI_ENGINE_ARTIFACTS_REPO: wazuh
  CI_ENGINE_ARTIFACTS_WORKFLOW: 5_builderpackage_engine-standalone

permissions:
  contents: read
  packages: read
  id-token: write

# This workflow runs when any of the following occur:
# - Run manually
# - Invoked from another workflow

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision number of the package."
        type: string
        default: "0"
        required: false
      upload:
        description: "Enable to upload the packages to the S3 bucket."
        type: boolean
        default: false
      is_stage:
        description: "Enable to use the release naming nomenclature."
        type: boolean
        default: false
      distribution:
        description: "Distribution format of the package [tar, rpm, deb]."
        type: choice
        options:
          - '[ "tar" ]'
          - '[ "deb" ]'
          - '[ "rpm" ]'
          - '[ "tar", "deb" ]'
          - '[ "tar", "rpm" ]'
          - '[ "deb", "rpm" ]'
          - '[ "tar", "deb", "rpm" ]'
        default: '[ "deb", "rpm" ]'
        required: true
      architecture:
        description: "Architecture of the package [x64, arm64]."
        type: choice
        options:
          - '[ "x64" ]'
          - '[ "arm64" ]'
          - '[ "x64", "arm64" ]'
        default: '[ "x64", "arm64" ]'
        required: true
      checksum:
        description: |
          Enable to generate the MD5 checksums of the packages.
          If the upload to the S3 bucket is enabled, these will be uploaded too.
        type: boolean
        default: false
      id:
        description: "ID used to identify the workflow uniquely."
        type: string
        required: false
      plugins_ref:
        description: "Branch, commit or tag for the wazuh-indexer plugins repositories and engine."
        type: string
        default: "main"
        required: false
  workflow_call:
    inputs:
      revision:
        type: string
        default: "0"
        required: false
      upload:
        type: boolean
        default: false
      is_stage:
        type: boolean
        default: false
      distribution:
        type: string
        default: '[ "rpm", "deb" ]'
      architecture:
        type: string
        default: '[ "x64", "arm64"  ]'
      checksum:
        type: boolean
        default: false
      id:
        type: string
        required: false
      plugins_ref:
        type: string
        default: "main"
        required: false
    secrets:
      AWS_INDEXER_ACTIONS_ROLE:
        required: true
        description: "AWS IAM OIDC role for S3 and infrastructure access"
      CI_INTERNAL_S3_BUCKET:
        required: true
        description: "Internal S3 bucket URI used to stage build artifacts"
      CI_AWS_REGION:
        required: true
        description: "AWS region for the internal S3 bucket and final package upload"
      CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY:
        required: true
        description: "AWS user access key for the final package upload"
      CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY:
        required: true
        description: "AWS user secret key for the final package upload"
      CI_OIDC_ROLE_ARN:
        required: true
        description: "AWS IAM OIDC role for authenticated pulls from ECR Public"

    outputs:
      name:
        description: Name of the package built.
        value: ${{ jobs.package-name.outputs.name }}

# ==========================
# Bibliography
# ==========================
#
# * Reusable workflows: limitations
#   | https://docs.github.com/en/actions/using-workflows/reusing-workflows#limitations
# * Using matrix in reusable workflows:
#   | https://docs.github.com/en/actions/using-workflows/reusing-workflows#using-a-matrix-strategy-with-a-reusable-workflow
# * Reading input from the called workflow
#   | https://docs.github.com/en/enterprise-cloud@latest/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_callinputs
# * Ternary operator
#   | https://docs.github.com/en/actions/learn-github-actions/expressions#example

jobs:
  branches:
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      wazuh_plugins_ref: ${{ steps.branches.outputs.wazuh_indexer_plugins_branch }}
      reporting_plugin_ref: ${{ steps.branches.outputs.wazuh_indexer_reporting_branch }}
      security_analytics_plugin_ref: ${{ steps.branches.outputs.wazuh_indexer_security_analytics_branch }}
      notifications_plugin_ref: ${{ steps.branches.outputs.wazuh_indexer_notifications_branch }}
      common_utils_plugin_ref: ${{ steps.branches.outputs.wazuh_indexer_common_utils_branch }}
      alerting_plugin_ref: ${{ steps.branches.outputs.wazuh_indexer_alerting_branch }}
      wazuh_ref: ${{ steps.branches.outputs.wazuh_branch }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve branches
        id: branches
        uses: ./.github/actions/5_builderpackage_indexer_branch_resolver
        with:
          branch: ${{ inputs.plugins_ref }}

  get-versions-wazuh-indexer:
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      opensearch_version: ${{ steps.version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            build-scripts/product_version.sh
            build-scripts/opensearch_version.sh
            buildSrc/version.properties

      - name: Read versions
        id: version
        run: |
          echo "version=$(bash ./build-scripts/product_version.sh)" >> "$GITHUB_OUTPUT"
          echo "opensearch_version=$(bash ./build-scripts/opensearch_version.sh)" >> "$GITHUB_OUTPUT"

  get-versions-wazuh-indexer-plugins:
    needs: [branches]
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.plugins_version.outputs.version }}
      opensearch_version: ${{ steps.plugins_version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wazuh/wazuh-indexer-plugins
          ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            tools/product_version.sh
            tools/opensearch_version.sh
            plugins/setup/build.gradle

      - name: Read versions
        id: plugins_version
        run: |
          echo "version=$(bash ./tools/product_version.sh)" >> "$GITHUB_OUTPUT"
          echo "opensearch_version=$(bash ./tools/opensearch_version.sh setup)" >> "$GITHUB_OUTPUT"

  get-versions-wazuh-indexer-reporting:
    needs: [branches]
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.reporting_version.outputs.version }}
      opensearch_version: ${{ steps.reporting_version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wazuh/wazuh-indexer-reporting
          ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            tools/product_version.sh
            tools/opensearch_version.sh
            build.gradle

      - name: Read versions
        id: reporting_version
        run: |
          echo "version=$(bash ./tools/product_version.sh)" >> "$GITHUB_OUTPUT"
           echo "opensearch_version=$(bash ./tools/opensearch_version.sh)" >> "$GITHUB_OUTPUT"

  get-versions-wazuh-indexer-security-analytics:
    needs: [branches]
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.security_analytics_version.outputs.version }}
      opensearch_version: ${{ steps.security_analytics_version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wazuh/wazuh-indexer-security-analytics
          ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            tools/product_version.sh
            tools/opensearch_version.sh
            build.gradle

      - name: Read versions
        id: security_analytics_version
        run: |
          echo "version=$(bash ./tools/product_version.sh)" >> "$GITHUB_OUTPUT"
          echo "opensearch_version=$(bash ./tools/opensearch_version.sh)" >> "$GITHUB_OUTPUT"

  get-versions-wazuh-indexer-notifications:
    needs: [branches]
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.notifications_version.outputs.version }}
      opensearch_version: ${{ steps.notifications_version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wazuh/wazuh-indexer-notifications
          ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            tools/product_version.sh
            tools/opensearch_version.sh
            build.gradle
            notifications/build.gradle

      - name: Read versions
        id: notifications_version
        run: |
          echo "version=$(bash ./tools/product_version.sh)" >> "$GITHUB_OUTPUT"
           echo "opensearch_version=$(bash ./tools/opensearch_version.sh)" >> "$GITHUB_OUTPUT"

  get-versions-wazuh-indexer-common-utils:
    needs: [branches]
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.common_utils_version.outputs.version }}
      opensearch_version: ${{ steps.common_utils_version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wazuh/wazuh-indexer-common-utils
          ref: ${{ needs.branches.outputs.common_utils_plugin_ref }}
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            tools/product_version.sh
            tools/opensearch_version.sh
            build.gradle

      - name: Read versions
        id: common_utils_version
        run: |
          echo "version=$(bash ./tools/product_version.sh)" >> "$GITHUB_OUTPUT"
          echo "opensearch_version=$(bash ./tools/opensearch_version.sh)" >> "$GITHUB_OUTPUT"

  get-versions-wazuh-indexer-alerting:
    needs: [ branches ]
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.alerting_version.outputs.version }}
      opensearch_version: ${{ steps.alerting_version.outputs.opensearch_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wazuh/wazuh-indexer-alerting
          ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
            tools/product_version.sh
            tools/opensearch_version.sh
            build.gradle

      - name: Read versions
        id: alerting_version
        run: |
          echo "version=$(bash ./tools/product_version.sh)" >> "$GITHUB_OUTPUT"
          echo "opensearch_version=$(bash ./tools/opensearch_version.sh)" >> "$GITHUB_OUTPUT"

  compatibility-check:
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    needs:
      [
        get-versions-wazuh-indexer,
        get-versions-wazuh-indexer-plugins,
        get-versions-wazuh-indexer-reporting,
        get-versions-wazuh-indexer-security-analytics,
        get-versions-wazuh-indexer-notifications,
        get-versions-wazuh-indexer-common-utils,
        get-versions-wazuh-indexer-alerting
      ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            build-scripts/check_compatibility_versions.sh

      - name: Check version compatibility
        env:
          INDEXER_VERSION: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
          OPENSEARCH_VERSION: ${{ needs.get-versions-wazuh-indexer.outputs.opensearch_version }}
          PLUGIN_VERSIONS: |
            wazuh-indexer-plugins|${{ needs.get-versions-wazuh-indexer-plugins.outputs.version }}|${{ needs.get-versions-wazuh-indexer-plugins.outputs.opensearch_version }}
            wazuh-indexer-reporting|${{ needs.get-versions-wazuh-indexer-reporting.outputs.version }}|${{ needs.get-versions-wazuh-indexer-reporting.outputs.opensearch_version }}
            wazuh-indexer-security-analytics|${{ needs.get-versions-wazuh-indexer-security-analytics.outputs.version }}|${{ needs.get-versions-wazuh-indexer-security-analytics.outputs.opensearch_version }}
            wazuh-indexer-notifications|${{ needs.get-versions-wazuh-indexer-notifications.outputs.version }}|${{ needs.get-versions-wazuh-indexer-notifications.outputs.opensearch_version }}
            wazuh-indexer-common-utils|${{ needs.get-versions-wazuh-indexer-common-utils.outputs.version }}|${{ needs.get-versions-wazuh-indexer-common-utils.outputs.opensearch_version }}
            wazuh-indexer-alerting|${{ needs.get-versions-wazuh-indexer-alerting.outputs.version }}|${{ needs.get-versions-wazuh-indexer-alerting.outputs.opensearch_version }}
        run: |
          bash build-scripts/check_compatibility_versions.sh

  setup:
    name: Set up variables
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      previous_version: ${{ steps.previous_versions.outputs.previous_version }}
      previous_4x_version: ${{ steps.previous_versions.outputs.previous_4x_version }}
      update_tests: ${{ steps.previous_versions.outputs.update_tests }}
    steps:
      - id: matrix
        run: |
          matrix=$(jq -cn \
              --argjson distribution '${{ inputs.distribution }}' \
              --argjson architecture '${{ inputs.architecture }}' \
              '{distribution: $distribution, architecture: $architecture}'
          )
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
      - name: Resolve previous release versions
        id: previous_versions
        run: |
          CURRENT_VERSION="$(bash build-scripts/product_version.sh)"
          # Capture the output first: a failure inside `< <(...)` would be ignored and leave the outputs empty.
          versions=$(GITHUB_TOKEN="${{ github.token }}" CURRENT_VERSION="$CURRENT_VERSION" \
            bash build-scripts/ci/resolve_previous_versions.sh)
          echo "$versions"
          echo "$versions" >> "$GITHUB_OUTPUT"

  # ==========================
  # Package targets (wazuh/wazuh-indexer#2130)
  # ==========================
  #
  # Each target (distribution x architecture) has its own chain:
  #   build-<dist>-<arch>     compiles the plugins and the core; does not wait for the engine.
  #   assemble-<dist>-<arch>  needs that build and the engine of its architecture; assembles,
  #                           tests and uploads the package.
  # A job inside a reusable workflow cannot need a job of its caller, so the chain is two
  # calls per target instead of one. The engine is built once per architecture.
  # Targets that were not requested are skipped.
  #
  # Reapers: a job cannot cancel another job directly, but entering its concurrency group
  # with cancel-in-progress does. reaper-build-* cancels a build whose engine failed, and
  # reaper-engine-* cancels an engine whose builds all failed. Otherwise they join a group
  # of their own and do nothing.

  engine-x64:
    needs: [compatibility-check, branches]
    if: ${{ contains(fromJSON(inputs.architecture), 'x64') }}
    concurrency:
      group: indexer-engine-${{ github.run_id }}-${{ github.run_attempt }}-x64
    uses: wazuh/wazuh/.github/workflows/5_builderpackage_engine-standalone.yml@5.0.0
    permissions:
      id-token: write
      contents: read
      packages: read
    with:
      # DEBUG ONLY (#2130 fault injection): a missing branch makes the x64 engine fail.
      wazuh-branch: ${{ inputs.id == '2130-failinject-engine' && 'nonexistent-2130' || needs.branches.outputs.wazuh_ref }}
      build-type: "release"
      arch: '[ "x64" ]'
    secrets: inherit

  engine-arm64:
    needs: [compatibility-check, branches]
    if: ${{ contains(fromJSON(inputs.architecture), 'arm64') }}
    concurrency:
      group: indexer-engine-${{ github.run_id }}-${{ github.run_attempt }}-arm64
    uses: wazuh/wazuh/.github/workflows/5_builderpackage_engine-standalone.yml@5.0.0
    permissions:
      id-token: write
      contents: read
      packages: read
    with:
      wazuh-branch: ${{ needs.branches.outputs.wazuh_ref }}
      build-type: "release"
      arch: '[ "arm64" ]'
    secrets: inherit

  build-tar-x64:
    needs: [setup, branches, compatibility-check, get-versions-wazuh-indexer]
    if: ${{ contains(fromJSON(inputs.distribution), 'tar') && contains(fromJSON(inputs.architecture), 'x64') }}
    concurrency:
      group: indexer-build-${{ github.run_id }}-${{ github.run_attempt }}-tar-x64
    uses: ./.github/workflows/5_builderpackage_indexer_build.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: tar
      architecture: x64
      revision: ${{ inputs.revision }}
      version: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
      wazuh_plugins_ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
      reporting_plugin_ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
      security_analytics_plugin_ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
      notifications_plugin_ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
      alerting_plugin_ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
      common_utils_plugin_ref: ${{ needs.branches.outputs.common_utils_plugin_ref }}

  build-tar-arm64:
    needs: [setup, branches, compatibility-check, get-versions-wazuh-indexer]
    if: ${{ contains(fromJSON(inputs.distribution), 'tar') && contains(fromJSON(inputs.architecture), 'arm64') }}
    concurrency:
      group: indexer-build-${{ github.run_id }}-${{ github.run_attempt }}-tar-arm64
    uses: ./.github/workflows/5_builderpackage_indexer_build.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: tar
      architecture: arm64
      revision: ${{ inputs.revision }}
      version: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
      wazuh_plugins_ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
      reporting_plugin_ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
      security_analytics_plugin_ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
      notifications_plugin_ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
      alerting_plugin_ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
      common_utils_plugin_ref: ${{ needs.branches.outputs.common_utils_plugin_ref }}

  build-deb-x64:
    needs: [setup, branches, compatibility-check, get-versions-wazuh-indexer]
    if: ${{ contains(fromJSON(inputs.distribution), 'deb') && contains(fromJSON(inputs.architecture), 'x64') }}
    concurrency:
      group: indexer-build-${{ github.run_id }}-${{ github.run_attempt }}-deb-x64
    uses: ./.github/workflows/5_builderpackage_indexer_build.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: deb
      architecture: x64
      revision: ${{ inputs.revision }}
      version: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
      wazuh_plugins_ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
      reporting_plugin_ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
      security_analytics_plugin_ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
      notifications_plugin_ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
      alerting_plugin_ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
      common_utils_plugin_ref: ${{ needs.branches.outputs.common_utils_plugin_ref }}

  build-deb-arm64:
    needs: [setup, branches, compatibility-check, get-versions-wazuh-indexer]
    if: ${{ contains(fromJSON(inputs.distribution), 'deb') && contains(fromJSON(inputs.architecture), 'arm64') }}
    concurrency:
      group: indexer-build-${{ github.run_id }}-${{ github.run_attempt }}-deb-arm64
    uses: ./.github/workflows/5_builderpackage_indexer_build.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: deb
      architecture: arm64
      revision: ${{ inputs.revision }}
      version: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
      wazuh_plugins_ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
      reporting_plugin_ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
      security_analytics_plugin_ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
      notifications_plugin_ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
      alerting_plugin_ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
      common_utils_plugin_ref: ${{ needs.branches.outputs.common_utils_plugin_ref }}

  build-rpm-x64:
    needs: [setup, branches, compatibility-check, get-versions-wazuh-indexer]
    if: ${{ contains(fromJSON(inputs.distribution), 'rpm') && contains(fromJSON(inputs.architecture), 'x64') }}
    concurrency:
      group: indexer-build-${{ github.run_id }}-${{ github.run_attempt }}-rpm-x64
    uses: ./.github/workflows/5_builderpackage_indexer_build.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: rpm
      architecture: x64
      revision: ${{ inputs.revision }}
      version: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
      wazuh_plugins_ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
      reporting_plugin_ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
      security_analytics_plugin_ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
      notifications_plugin_ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
      alerting_plugin_ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
      # DEBUG ONLY (#2130 fault injection): a missing branch makes the rpm x64 build fail.
      common_utils_plugin_ref: ${{ inputs.id == '2130-failinject-build' && 'nonexistent-2130' || needs.branches.outputs.common_utils_plugin_ref }}

  build-rpm-arm64:
    needs: [setup, branches, compatibility-check, get-versions-wazuh-indexer]
    if: ${{ contains(fromJSON(inputs.distribution), 'rpm') && contains(fromJSON(inputs.architecture), 'arm64') }}
    concurrency:
      group: indexer-build-${{ github.run_id }}-${{ github.run_attempt }}-rpm-arm64
    uses: ./.github/workflows/5_builderpackage_indexer_build.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: rpm
      architecture: arm64
      revision: ${{ inputs.revision }}
      version: ${{ needs.get-versions-wazuh-indexer.outputs.version }}
      wazuh_plugins_ref: ${{ needs.branches.outputs.wazuh_plugins_ref }}
      reporting_plugin_ref: ${{ needs.branches.outputs.reporting_plugin_ref }}
      security_analytics_plugin_ref: ${{ needs.branches.outputs.security_analytics_plugin_ref }}
      notifications_plugin_ref: ${{ needs.branches.outputs.notifications_plugin_ref }}
      alerting_plugin_ref: ${{ needs.branches.outputs.alerting_plugin_ref }}
      common_utils_plugin_ref: ${{ needs.branches.outputs.common_utils_plugin_ref }}

  assemble-tar-x64:
    needs: [setup, build-tar-x64, engine-x64]
    if: ${{ contains(fromJSON(inputs.distribution), 'tar') && contains(fromJSON(inputs.architecture), 'x64') }}
    uses: ./.github/workflows/5_builderpackage_indexer_assemble.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    with:
      distribution: tar
      architecture: x64
      revision: ${{ inputs.revision }}
      is_stage: ${{ inputs.is_stage }}
      upload: ${{ inputs.upload }}
      checksum: ${{ inputs.checksum }}
