cluster.name: "docker-cluster"
network.host: 0.0.0.0
# Default location for filesystem snapshot repositories inside the container, so one can be
# registered with no further configuration. This is only a default: mount a volume here to keep
# backups outside the container, or point the setting elsewhere. On a cluster, an fs repository
# must be one shared filesystem mounted at the same path on every node.
path.repo: ["/usr/share/wazuh-indexer/backup"]
