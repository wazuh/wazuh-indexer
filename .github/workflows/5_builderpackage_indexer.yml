    if: ${{ !cancelled() && contains(fromJSON(inputs.distribution), 'rpm') && contains(fromJSON(inputs.architecture), 'arm64') }}
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: ${{ needs.engine-arm64.result == 'failure' && format('indexer-build-{0}-{1}-rpm-arm64', github.run_id, github.run_attempt) || format('indexer-reaper-{0}-{1}-build-rpm-arm64', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    steps:
