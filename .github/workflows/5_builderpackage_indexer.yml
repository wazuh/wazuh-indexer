      checksum: ${{ inputs.checksum }}
      previous_version: ${{ needs.setup.outputs.previous_version }}
      previous_4x_version: ${{ needs.setup.outputs.previous_4x_version }}
      update_tests: ${{ needs.setup.outputs.update_tests }}

  reaper-build-tar-x64:
    needs: [engine-x64]
    if: ${{ !cancelled() && contains(fromJSON(inputs.distribution), 'tar') && contains(fromJSON(inputs.architecture), 'x64') }}
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: ${{ needs.engine-x64.result == 'failure' && format('indexer-build-{0}-{1}-tar-x64', github.run_id, github.run_attempt) || format('indexer-reaper-{0}-{1}-build-tar-x64', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    steps:
      - name: Cancel the build if the engine failed
        run: |
          echo "engine-x64 result: ${{ needs.engine-x64.result }}"

  reaper-build-tar-arm64:
    needs: [engine-arm64]
    if: ${{ !cancelled() && contains(fromJSON(inputs.distribution), 'tar') && contains(fromJSON(inputs.architecture), 'arm64') }}
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: ${{ needs.engine-arm64.result == 'failure' && format('indexer-build-{0}-{1}-tar-arm64', github.run_id, github.run_attempt) || format('indexer-reaper-{0}-{1}-build-tar-arm64', github.run_id, github.run_attempt) }}
