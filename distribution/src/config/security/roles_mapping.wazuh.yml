
# ---------------------------------------------------------------------#
# Wazuh Indexer Default Roles Mappings
# ---------------------------------------------------------------------#
#
# One composite role per user.

dashboard_server:
  reserved: true
  hidden: false
  users:
    - "kibanaserver"

wazuh_admin:
  reserved: true
  hidden: false
  users:
    - "wazuh-admin"
  backend_roles:
    - "admin"

wazuh_demo:
  reserved: true
  hidden: false
  users:
    - "wazuh-demo"

wazuh_readonly:
  reserved: true
  hidden: false
  users:
    - "wazuh-readonly"

wazuh_manager:
  reserved: true
  hidden: false
  users:
    - "wazuh-manager"

# Mapped to every authenticated user. The role's DLS query scopes each user's
# READS down to their own AI assistant conversations; their writes are scoped
# instead by the setup plugin, which stamps the owner server-side. Granting
# this role to everyone is therefore safe: it confers access to the caller's
# own conversations and nothing else. See the comment above the role itself.
wazuh_ai_assistant:
  reserved: true
  hidden: false
  users:
    - "*"
