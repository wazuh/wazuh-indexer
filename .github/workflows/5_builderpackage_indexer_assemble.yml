name: (5.x) Build packages - assemble

# Package stage of one package target (wazuh/wazuh-indexer#2130): downloads the
# engine of its architecture and the stage contract of its build job, assembles
# the package with the builder (BUILD_PHASE=package), runs the package tests and
# uploads the package. Called once per target by 5_builderpackage_indexer.yml,
# only after the build job of the target and the engine of its architecture succeeded.

env:
  CI_ARTIFACTS_REPO: wazuh-indexer
  CI_ARTIFACTS_WORKFLOW: 5_builderpackage_indexer

permissions:
  contents: read
  packages: read
  id-token: write

on:
  workflow_call:
    inputs:
      distribution:
        type: string
        required: true
      architecture:
        type: string
        required: true
      revision:
        type: string
        required: true
      is_stage:
        type: boolean
        required: true
      upload:
        type: boolean
        required: true
      checksum:
        type: boolean
        required: true
      previous_version:
        type: string
        default: ""
      previous_4x_version:
        type: string
        default: ""
      update_tests:
        type: string
        default: "false"
    secrets:
      AWS_INDEXER_ACTIONS_ROLE:
        required: true
        description: "AWS IAM OIDC role for S3 and infrastructure access"
      CI_INTERNAL_S3_BUCKET:
        required: true
        description: "Internal S3 bucket URI used to stage build artifacts"
      CI_AWS_REGION:
        required: true
        description: "AWS region for the internal S3 bucket and final package upload"
      CI_OIDC_ROLE_ARN:
        required: true
        description: "AWS IAM OIDC role for authenticated pulls from ECR Public"
      CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY:
        required: true
        description: "AWS user access key for the final package upload"
      CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY:
        required: true
        description: "AWS user secret key for the final package upload"
    outputs:
      name:
        description: Name of the package built.
        value: ${{ jobs.assemble.outputs.name }}

jobs:
  assemble:
    timeout-minutes: 90
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-${{ inputs.architecture == 'arm64' && 'arm' || 'amd' }}-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      name: ${{ steps.package.outputs.name }}
    # Docker Hub limits anonymous pulls per IP, which the shared runners reach. The test
    # images come from ECR Public, with authenticated pulls, and from the Red Hat registry.
    env:
      UBUNTU_IMAGE: public.ecr.aws/ubuntu/ubuntu:jammy
      UBI_IMAGE: registry.access.redhat.com/ubi9/ubi:latest
      UBI_INIT_IMAGE: registry.access.redhat.com/ubi9/ubi-init:latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_INDEXER_ACTIONS_ROLE }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      # Built by the engine job of this architecture
      - name: Download Wazuh Engine
        run: |
          mkdir -p "${{ github.workspace }}/artifacts/engine"
          arch_suffix="${{ inputs.architecture == 'x64' && 'amd64' || 'arm64' }}"
          bucket="${{ secrets.CI_INTERNAL_S3_BUCKET }}"
          s3_base="s3://${bucket#s3://}/${{ env.CI_ARTIFACTS_REPO }}/${{ env.CI_ARTIFACTS_WORKFLOW }}"
          aws s3 cp "$s3_base/" "${{ github.workspace }}/artifacts/engine/" --recursive \
            --exclude "*" --include "${{ github.run_id }}/wazuh-engine-*-linux-${arch_suffix}.zip"

          shopt -s nullglob
          archives=("${{ github.workspace }}/artifacts/engine"/${{ github.run_id }}/wazuh-engine-*-linux-${arch_suffix}.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No Wazuh Engine artifacts found in S3 for run ${{ github.run_id }} (arch ${arch_suffix})"
            aws s3 ls "$s3_base/" || true
            exit 1
          fi
          # More than one engine for this architecture (for example, left by an earlier attempt
          # that built another version) would make the choice arbitrary.
          if [ ${#archives[@]} -gt 1 ]; then
            echo "::error::Several Wazuh Engine artifacts found for run ${{ github.run_id }} (arch ${arch_suffix}): ${archives[*]##*/}"
            exit 1
          fi

          unzip -j -o "${archives[0]}" -d "${{ github.workspace }}/artifacts/engine"

          engine_pattern="wazuh-engine-*-linux-${arch_suffix}.tar.gz"
          if ! find "${{ github.workspace }}/artifacts/engine" -maxdepth 1 -type f -name "$engine_pattern" | grep -q .; then
            echo "::error::No Wazuh Engine tarball found for pattern $engine_pattern"
            ls -l "${{ github.workspace }}/artifacts/engine" || true
            exit 1
          fi

      # Left by the build job of this target
      - name: Download the stage contract
        run: |
          bucket="${{ secrets.CI_INTERNAL_S3_BUCKET }}"
          s3_contract="s3://${bucket#s3://}/${{ env.CI_ARTIFACTS_REPO }}/${{ env.CI_ARTIFACTS_WORKFLOW }}/${{ github.run_id }}/stage-contract/${{ inputs.distribution }}-${{ inputs.architecture }}"
          mkdir -p "${{ runner.temp }}/stage-contract"
          aws s3 cp "${s3_contract}/contract.json" "${{ runner.temp }}/stage-contract/contract.json"
          aws s3 cp "${s3_contract}/contract.tar" "${{ runner.temp }}/stage-contract/contract.tar"
          WORKSPACE="${{ github.workspace }}" bash build-scripts/ci/stage_contract.sh unpack \
            -d "${{ inputs.distribution }}" \
            -a "${{ inputs.architecture }}" \
            -i "${{ runner.temp }}/stage-contract"

      - name: Prepare workspace
        run: |
            WORKSPACE="${{ github.workspace }}" bash build-scripts/ci/prepare_workspace.sh
            # TODO: remove once Docker daemon and Compose are baked into the runner image.
            bash build-scripts/ci/ensure_docker.sh

      # The builder and the Ubuntu test images are pulled from ECR Public. Its token is always issued
      # in us-east-1, whatever the region of the role.
      - name: Set up AWS CLI for ECR Public
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CI_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      - name: Log in to ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Assemble the package with the Docker builder
        env:
          CTI_API_URL: ${{ vars.CTI_API_URL }}
        run: |
          ENGINE_TARBALL=$(ENGINE_DIR="${{ github.workspace }}/artifacts/engine" \
            bash build-scripts/ci/find_engine_tarball.sh)
          echo "Using engine tarball: $ENGINE_TARBALL"

          cd build-scripts/builder
          bash ./builder.sh \
            -b package \
            -e "$ENGINE_TARBALL" \
            -R "${{ inputs.revision }}" \
            -S "${{ inputs.is_stage }}" \
            -d "${{ inputs.distribution }}" \
            -a "${{ inputs.architecture }}"

      - name: Resolve built package name
        id: package
        run: |
          name=$(DIST_DIR="${{ github.workspace }}/artifacts/dist" \
            bash build-scripts/ci/resolve_package_name.sh)
          echo "Built package: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test RPM package installation
        if: ${{ inputs.distribution == 'rpm' }}
        run: |
          docker pull "$UBI_IMAGE"
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            "$UBI_IMAGE" \
            bash -c "yum localinstall '/artifacts/dist/${{ steps.package.outputs.name }}' -y"

      - name: Test RPM package host tools
        if: ${{ inputs.distribution == 'rpm' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBI_IMAGE" \
            bash -c "dnf install -y -q cpio gawk > /dev/null 2>&1; PACKAGE='/artifacts/dist/${{ steps.package.outputs.name }}' bash /build-scripts/ci/test_host_tools.sh"

      - name: Test RPM package setup plugin configuration
        if: ${{ inputs.distribution == 'rpm' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBI_IMAGE" \
            bash -c "PACKAGE='/artifacts/dist/${{ steps.package.outputs.name }}' bash /build-scripts/ci/test_setup_config.sh"

      - name: Test RPM package uninstallation
        if: ${{ inputs.distribution == 'rpm' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            "$UBI_IMAGE" \
            bash -c "yum localinstall '/artifacts/dist/${{ steps.package.outputs.name }}' -y && yum remove wazuh-indexer -y"

      - name: Test RPM package leaves nothing behind on removal
        if: ${{ inputs.distribution == 'rpm' }}
        run: |
          SYSTEMD_IMAGE="$UBI_INIT_IMAGE" \
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" "
            PACKAGE_MANAGER=rpm \
            PACKAGE_NAME=${{ steps.package.outputs.name }} \
            bash /build-scripts/ci/test_purge.sh
          "

      - name: Test RPM credential and TLS resolution
        if: ${{ inputs.distribution == 'rpm' }}
        run: |
          SYSTEMD_IMAGE="$UBI_INIT_IMAGE" \
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" '
            set -e
            # ubi9-init ships neither curl nor a bcrypt module. curl is required;
            # bcrypt only enables the digest-vs-password check, which otherwise
            # skips, so its install is allowed to fail on an offline runner.
            command -v curl >/dev/null || dnf install -y -q curl
            (dnf install -y -q python3-pip && pip3 install -q bcrypt) || true
            PACKAGE="/artifacts/dist/${{ steps.package.outputs.name }}" \
              bash /build-scripts/ci/test_credentials.sh
          '

      - name: Test RPM package update stopping the indexer
        if: ${{ inputs.distribution == 'rpm' && inputs.update_tests == 'true' }}
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBI_IMAGE" \
            bash -c "bash /build-scripts/indexer_node_install.sh ${{ inputs.previous_version }} && \
                     systemctl stop wazuh-indexer && \
                     yum localinstall '/artifacts/dist/${{ steps.package.outputs.name }}' -y && \
                     if systemctl is-active --quiet wazuh-indexer; then echo 'Indexer running (unexpected)'; exit 1; else echo 'Indexer stopped (expected)'; fi"

      - name: Test RPM package update without stopping the indexer
        if: ${{ inputs.distribution == 'rpm' && inputs.update_tests == 'true' }}
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBI_IMAGE" \
            bash -c "bash /build-scripts/indexer_node_install.sh ${{ inputs.previous_version }} && \
                     yum localinstall '/artifacts/dist/${{ steps.package.outputs.name }}' -y && \
                     if systemctl is-active --quiet wazuh-indexer; then echo 'Indexer running (expected)'; else echo 'Indexer not running (unexpected)'; exit 1; fi"

      - name: Test RPM package refuses upgrade from 4.x
        if: ${{ inputs.distribution == 'rpm' && inputs.previous_4x_version != '' }}
        run: |
          cid=$(docker run -d --rm \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBI_INIT_IMAGE" /sbin/init)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          docker exec "$cid" bash -c "
            PACKAGE_MANAGER=rpm \
            PACKAGE_NAME=${{ steps.package.outputs.name }} \
            PREVIOUS_VERSION=${{ inputs.previous_4x_version }} \
            bash /build-scripts/ci/test_upgrade_block.sh
          "

      - name: Test DEB package installation
        if: ${{ inputs.distribution == 'deb' }}
        run: |
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            bash /build-scripts/ci/install_package_dependencies.sh \
              "/artifacts/dist/${{ steps.package.outputs.name }}"
            dpkg -i "/artifacts/dist/${{ steps.package.outputs.name }}"
            apt-get remove --purge wazuh-indexer -y
          '

      - name: Test DEB package host tools
        if: ${{ inputs.distribution == 'deb' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBUNTU_IMAGE" \
            bash -c "PACKAGE='/artifacts/dist/${{ steps.package.outputs.name }}' bash /build-scripts/ci/test_host_tools.sh"

      - name: Test DEB package setup plugin configuration
        if: ${{ inputs.distribution == 'deb' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/dist:/artifacts/dist" \
            -v "${{ github.workspace }}/build-scripts/:/build-scripts/" \
            "$UBUNTU_IMAGE" \
            bash -c "PACKAGE='/artifacts/dist/${{ steps.package.outputs.name }}' bash /build-scripts/ci/test_setup_config.sh"

      - name: Test DEB package leaves nothing behind on purge
        if: ${{ inputs.distribution == 'deb' }}
        run: |
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" "
            PACKAGE_MANAGER=deb \
            PACKAGE_NAME=${{ steps.package.outputs.name }} \
            bash /build-scripts/ci/test_purge.sh
          "

      - name: Test DEB credential and TLS resolution
        if: ${{ inputs.distribution == 'deb' }}
        run: |
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # python3-bcrypt lets the suite verify each digest against the
            # password that was published; without it that check is skipped.
            apt-get install -y -qq python3-bcrypt || true
            PACKAGE="/artifacts/dist/${{ steps.package.outputs.name }}" \
              bash /build-scripts/ci/test_credentials.sh
          '

      - name: Test DEB needrestart rule
        if: ${{ inputs.distribution == 'deb' }}
        run: |
          # Ubuntu 22.04 and 24.04 ship different needrestart releases.
          for release in jammy noble; do
            echo "::group::Ubuntu ${release}"
            SYSTEMD_IMAGE="wazuh-indexer-systemd-test:${release}" \
              bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" '
                PACKAGE="/artifacts/dist/${{ steps.package.outputs.name }}" \
                  bash /build-scripts/ci/test_needrestart.sh
              '
            echo "::endgroup::"
          done

      - name: Test DEB package update stopping the indexer
        if: ${{ inputs.distribution == 'deb' && inputs.update_tests == 'true' }}
        run: |
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            bash /build-scripts/indexer_node_install.sh ${{ inputs.previous_version }}
            systemctl stop wazuh-indexer
            bash /build-scripts/ci/install_package_dependencies.sh \
              "/artifacts/dist/${{ steps.package.outputs.name }}"
            dpkg -i --force-confnew "/artifacts/dist/${{ steps.package.outputs.name }}"
          '

      - name: Test DEB package update without stopping the indexer
        if: ${{ inputs.distribution == 'deb' && inputs.update_tests == 'true' }}
        run: |
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            bash /build-scripts/indexer_node_install.sh ${{ inputs.previous_version }}
            bash /build-scripts/ci/install_package_dependencies.sh \
              "/artifacts/dist/${{ steps.package.outputs.name }}"
            dpkg -i --force-confnew "/artifacts/dist/${{ steps.package.outputs.name }}"
          '

      - name: Test DEB package refuses upgrade from 4.x
        if: ${{ inputs.distribution == 'deb' && inputs.previous_4x_version != '' }}
        run: |
          bash build-scripts/run_in_systemd_container.sh "${{ github.workspace }}" "
            export DEBIAN_FRONTEND=noninteractive
            PACKAGE_MANAGER=deb \
            PACKAGE_NAME=${{ steps.package.outputs.name }} \
            PREVIOUS_VERSION=${{ inputs.previous_4x_version }} \
            bash /build-scripts/ci/test_upgrade_block.sh
          "


      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_INDEXER_ACTIONS_ROLE }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload package artifact to S3
        run: |
          pkg_name="${{ steps.package.outputs.name }}"
          pkg_path="artifacts/dist/${pkg_name}"
          s3_base="${{ secrets.CI_INTERNAL_S3_BUCKET }}/${{ env.CI_ARTIFACTS_REPO }}/${{ env.CI_ARTIFACTS_WORKFLOW }}/${{ github.run_id }}"

          if [ ! -f "$pkg_path" ]; then
            echo "::error::Package not found at ${pkg_path}"
            exit 1
          fi

          aws s3 cp "$pkg_path" "${s3_base}/${pkg_name}"
          echo "::notice::Uploaded artifact to S3: ${s3_base}/${pkg_name}"

      - name: Set up AWS CLI for final package upload
        if: ${{ inputs.upload }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CI_INTERNAL_DEVELOPMENT_BUCKET_USER_SECRET_KEY }}
          aws-region: ${{ secrets.CI_AWS_REGION }}

      - name: Upload final package to S3
        if: ${{ inputs.upload }}
        run: |
          src="artifacts/dist/${{ steps.package.outputs.name }}"
          dest="${{ vars.S3_PACKAGES_URI }}"
          aws s3 cp "$src" "$dest"
          s3uri="${dest}${{ steps.package.outputs.name }}"
          echo "::notice::S3 URI: ${s3uri}"

      - name: Upload checksum to S3
        if: ${{ inputs.upload && inputs.checksum }}
        run: |
          src="artifacts/dist/${{ steps.package.outputs.name }}.sha512"
          dest="${{ vars.S3_PACKAGES_URI }}"
          aws s3 cp "$src" "$dest"
          s3uri="${dest}${{ steps.package.outputs.name }}.sha512"
          echo "::notice::S3 sha512 URI: ${s3uri}"
