  reaper-engine-x64:
    needs: [build-tar-x64, build-deb-x64, build-rpm-x64]
    if: ${{ !cancelled() && contains(fromJSON(inputs.architecture), 'x64') }}
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: ${{ (needs.build-tar-x64.result != 'success' && needs.build-deb-x64.result != 'success' && needs.build-rpm-x64.result != 'success') && format('indexer-engine-{0}-{1}-x64', github.run_id, github.run_attempt) || format('indexer-reaper-{0}-{1}-engine-x64', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    steps:
      - name: Cancel the engine if no build of this architecture succeeded
        run: |
          echo "builds of x64: ${{ join(needs.*.result, ', ') }}"

  reaper-engine-arm64:
    needs: [build-tar-arm64, build-deb-arm64, build-rpm-arm64]
    if: ${{ !cancelled() && contains(fromJSON(inputs.architecture), 'arm64') }}
    timeout-minutes: 5
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
