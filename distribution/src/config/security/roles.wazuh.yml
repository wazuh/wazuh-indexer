# ---------------------------------------------------------------------#
# wazuh-manager: service account. Reads CTI consumer state, active
# responses and threat intelligence content; ingests events, metrics
# and states; manages state documents (index + delete).
# ---------------------------------------------------------------------#
wazuh_manager:
  reserved: true
  hidden: false
  cluster_permissions:
    - 'cluster_composite_ops'
    - 'cluster_monitor'
  index_permissions:
    - index_patterns:
        - '.wazuh-cti-consumers'
        - '.wazuh-active-responses-*'
        - 'wazuh-threatintel-*'
      allowed_actions:
        - 'read'
    - index_patterns:
        - 'wazuh-events-v5-*'
        - 'wazuh-metrics-*'
      allowed_actions:
        - 'read'
        - 'index'
    - index_patterns:
        - 'wazuh-states-*'
      allowed_actions:
        - 'read'
        - 'index'
        - 'delete'
    - index_patterns:
        - '.wazuh-threatintel-vulnerabilities*'
        - 'wazuh-threatintel-*'
      allowed_actions:
        - 'manage_point_in_time'
  tenant_permissions: []
  static: true
